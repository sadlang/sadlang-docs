# ============================================================================
# بيان المزامنة: يوثّق منشأ صفحات المرجع المُولَّدة ويربطها بمصادرها في
# مستودع اللغة. يستهلكه سير العمل sync.yml لإعادة توليد الصفحات عند تغيّر SoT.
# (AR) صفحات reference/ التالية تُولَّد آليًّا — لا تُحرَّر يدويًّا.
# ============================================================================
repo: sadlang/s-programming-language

# الفرع الذي تُزامَن معه **اللقطة المودَعة** في المستودع (للتطوير المحلّيّ):
# dev = القناة القادمة (حيث يؤلّف المطوّرون التوثيق وقت التطوير).
# ملاحظة: الموقع المنشور يبني قناتين معًا عند النشر (deploy.yml) ويُعيد توليد
# المرجع من فرع كلّ قناة — المستقرّ من sadlang (الجذر) والقادم من dev (/next/).
ref: dev

# نسخة اللغة التي تغطّيها هذه الصفحات (تُحدَّث عند مراجعة إصدار).
covers_version: "1.0.0"

# ربط كل صفحة مُولَّدة بملفّات SoT التي تُشتقّ منها.
generated:
  - file: src/reference/keywords.md
    sources:
      - language-truth/keywords.yaml
  - file: src/reference/operators.md
    sources:
      - language-truth/operators.yaml
  - file: src/reference/types.md
    sources:
      - language-truth/keywords.yaml
      - language-truth/types.yaml

# صفحات مكتوبة يدويًّا (نثريّة) لكنّها تابعة لـSoT — تُراجَع عند تغيّر المصدر،
# ولا يُعيد المولّد كتابتها.
manual_tracked:
  - file: src/reference/grammar.md
    sources:
      - language-truth/grammar
  - file: src/reference/sot.md
    sources:
      - language-truth/_schemas
  # صفحة خصائص SadUI نثريّة (مجموعات + نظام المحاذاة) — تُراجَع عند تغيّر مفاتيح
  # الخصائص أو محرّك التخطيط. القائمة الكاملة (٨٢ مفتاحًا) في ui_props.yaml.
  - file: src/reference/sadui-properties.md
    sources:
      - language-truth/ui_props.yaml
      - features/graphics/core/src/layout.cpp
  # فصل الاستيعابات نثريّ لكنّه يوثّق قواعد gr.adv.*_comprehension — يُراجَع عند
  # تغيّر النحو (بما في ذلك فكّ الزوج «لكل مفتاح، قيمة في خريطة»، RFC 25 التعارض 1أ).
  - file: src/language/comprehensions.md
    sources:
      - language-truth/grammar/60_advanced.yaml
  # فصل الأدوات نثريّ لكنّه يوثّق أسطح أوامر الأدوات — يُراجَع عند تغيّر
  # واجهات سطر الأوامر في مستودع اللغة (رايات/أوامر/مرادفات عربيّة).
  - file: src/tools/run-build.md
    sources:
      - apps/sad-run/main.cpp
      - tools/compiler/compiler_driver_cli.cpp
  - file: src/tools/package-manager.md
    sources:
      - tools/pkg/cli_v2.cpp
      - tools/compiler/compiler_driver_pkg.cpp
  - file: src/tools/quality.md
    sources:
      - tools/formatter
      - tools/check/src/main.cpp
      - tools/lsp
  # صفحة التزامن نثريّة — تُراجَع عند تغيّر كلمات/قواعد التزامن أو مدمجات
  # قناة/قفل/مستقبل/مجموعة_انتظار.
  - file: src/language/concurrency.md
    sources:
      - language-truth/keywords.yaml
      - tests/behavior/sections/07_التزامن
  # صفحة التشفير والأمان نثريّة — تُراجَع عند تغيّر دوال هاش/شفّر/فك_تشفير
  # في وحدة تأكيدات (توحيد المفسّر/المترجم #212، اختبارات 04_تشفير #213).
  - file: src/language/security.md
    sources:
      - language-truth/builtins/assertions.yaml
      - tests/behavior/sections/09_المكتبة_القياسية/04_تشفير
