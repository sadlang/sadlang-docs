# ============================================================================
# فحص الجودة — على كل PR إلى main **وعلى الدفع إلى main**:
#   1) اختبارات المولّد الذهبيّة: لقطة SoT مجمَّدة → مخرج متوقَّع مودَع.
#      تقيس المولّد وحده (طرفٌ ثابت)، خلافًا لـ--check القديمة التي كانت
#      تقارن مخرج المولّد بمخرج المولّد من مصدرٍ متحرّك — طرفان من أصلٍ واحد.
#   2) توليد صفحات المرجع + بناء mdBook **على القناتين معًا** (sadlang, dev):
#      النشر يبني الاثنتين، فلا يجوز أن يُقاس البناء على واحدةٍ فقط.
#   3) فحص روابط الإخراج المبنيّ بـ lychee.
# لا ينشر — النشر في deploy.yml.
# ملاحظة: لم تعد هناك «بوّابة انجراف»؛ الصفحات المشتقّة لا تُودَع أصلًا فلا
# تنجرف. انظر .gitignore و tests/README.md.
# ============================================================================
name: فحص التوثيق (ذهبيّ + بناء القناتين + روابط)

on:
  pull_request:
    branches: [main]
  # الدفع المباشر إلى main كان يتخطّى كلّ البوّابات ثمّ ينشر. لم يعد.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── الحارس الحقيقيّ للمولّد: مُدخَلٌ مجمَّد ومخرجٌ متوقَّع ────────────────────
  generator-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: اختبارات المولّد الذهبيّة
        run: python -m unittest discover -s tests -v

  # ── البناء على القناتين ────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [sadlang, dev]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: توليد صفحات المرجع من SoT (${{ matrix.ref }})
        run: python scripts/gen_reference.py --fetch ${{ matrix.ref }}

      # حارس: mdBook لا يفشل على صفحةٍ مذكورةٍ في SUMMARY وملفُّها غائب — يُنشئ
      # جذاذةً (عنوانًا وحده) ويبني بنجاح. فلولا هذا لنُشرت صفحات مرجعٍ بيضاء بصمت.
      - name: التحقّق من أنّ الصفحات مُولَّدةٌ لا جذاذات
        run: python scripts/gen_reference.py --verify

      - name: تثبيت mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: تثبيت mdbook-mermaid + أصوله
        run: |
          cargo install mdbook-mermaid --locked
          mdbook-mermaid install .

      - name: البناء
        run: mdbook build

      - name: فحص الروابط الداخليّة (lychee على الإخراج المبنيّ)
        uses: lycheeverse/lychee-action@v2
        with:
          # نستثني 404.html: صفحة يولّدها mdBook بروابط جذريّة مطلقة (href="/")
          # مقصودة كي تعمل من أيّ عمق مسار عند النشر؛ لا يقدر --offline على حلّها.
          args: --offline --no-progress --exclude-path book/404.html "book/**/*.html"
          fail: true
