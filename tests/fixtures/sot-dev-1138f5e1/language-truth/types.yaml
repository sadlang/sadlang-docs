  - { id: type.uint32,  kind: UInt32,  word: طبيعي32, name_en: uint32, category: sized_primitive, size_bytes: 4, numeric: unsigned, surface: true,  token_type: TYPE_U32, default_init: int_zero, since: "1.0.0", status: stable, description_ar: "عدد طبيعي 32-بت", description_en: "32-bit unsigned integer" }
  # (AR) 🔑 ولا `typeof_ar` هنا (قرارُ المالك 2026-08-26): كان «رقم» وسمًا
  #      وُضِعَ لئلّا يتحرّكَ سلوكٌ مقيسٌ يومَ فُتِحَت أُسرةُ الأعراض، فصارَ —
