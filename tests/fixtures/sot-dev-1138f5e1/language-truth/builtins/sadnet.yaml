# ═══════════════════════════════════════════════════════════════════════
# (AR) الدوالُّ السبعُ الآتيةُ كانت **منفَّذةً في الشيفرةِ وغيرَ معلَنةٍ ههنا**:
#      لامبداتٌ مكتملةٌ في builtin_module_sadnet.cpp تُبنى داخلَ كتلةٍ `{ }`
#      ثمّ تموتُ محلّيّةً بلا `registerBuiltinFunction`. ولم يكشفها أحدٌ لأنّ
#      الملفَّ كلَّه خلفَ `#ifdef HAS_SADNET` لم يصدُقْ قطّ — فلا مترجّمٌ رآها
#      ولا حارسُ تغطيةٍ عدَّها. أُعلِنت ههنا ورُبِطت هناك.
#      🔑 وبُذِرت لها `arity` مشتقّةً من حارسِ كلِّ ذراعٍ (`args.size() < N`)
#         ثمّ **نُزِعت**: حارسُ «رتبةُ المدمجِ من مصدرِ الحقيقة» أحمرَّ عليها
#         بـ«إعلاناتُ arity لا تفرضُها ذراع ⇒ عقدٌ لا يُطبَّق» — والمترجّمُ
#         بلا ذراعٍ لِـSadNet البتّة (صفرُ ذكرٍ في compiler/src). فالإعلانُ
#         كان سيَعِدُ بفرضٍ لا يقعُ. والرتبُ المقيسةُ محفوظةٌ ههنا نصًّا حتّى
#         تُكتَبَ أذرعُ المترجّم، فتُبذَرَ حينَها ويُفرَضَ العقد:
#           dht_تخزين ٣ · dht_بحث ٢ · dns_تسجيل ٣ · dns_حل ٢
#           cdn_نشر ٤ · cdn_محتوى ٢ · snet_إصدار ٠
# (EN) The seven functions below were IMPLEMENTED but UNDECLARED: complete
#      lambdas built into a bare `{ }` block and never registered. Nothing
#      caught it because the whole TU sat behind an #ifdef that never held.
#      Arities were derived from each lambda's own guard, then removed: no
#      compiler arm exists for SadNet, so a declared arity would be a contract
#      nobody applies. The measured values are recorded above for when arms land.
# ═══════════════════════════════════════════════════════════════════════
