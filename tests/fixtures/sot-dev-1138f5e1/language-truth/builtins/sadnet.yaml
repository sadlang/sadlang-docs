# (AR) 🔑 اسمُه `DNS_REGISTER` أوّلَ مرّة، فاصطدمَ بماكرو Win32:
#      `ddeml.h:378  #define DNS_REGISTER 0x0001` — يصلُ عبر windows.h. والمعالجُ
#      الأوّليُّ يستبدلُه داخلَ `Names::SadNet::DNS_REGISTER` فتنهارُ الترجمةُ
#      بـ٤٠٨ أخطاءٍ متتالية أوّلُها C2589. 🔑 **مُعرِّفُ الـcpp_id يدخلُ فضاءَ
#      ماكروهات كلِّ رأسِ منصّةٍ يُدرجُه المستهلك**؛ فالاسمُ القصيرُ العامُّ
#      بأحرفٍ كبيرةٍ لغمٌ — يُطوَّلُ ويُخصَّص. لا تُعِدْه إلى `DNS_REGISTER`.
# (EN) Was DNS_REGISTER; collides with the Win32 macro in ddeml.h (via windows.h).
#      A cpp_id lands in the macro namespace of every platform header the consumer
#      pulls in — keep such identifiers long and specific. Do not revert.
