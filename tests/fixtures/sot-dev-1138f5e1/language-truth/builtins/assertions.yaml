- cpp_id: ENCRYPT
  canonical: شفر
  namespace: Assertions
  arity:
    min: 2
    max: 2
  category: MODULE_FUNCTION
  require_import: true
  module: ASSERTIONS
  compiler_strategy: RUNTIME_CALL
  since: 0.1.0
  status: stable
  description_ar: >-
    تشفير نصّ بمفتاح عبر تدفق SHA-256-CTR (SHA-256(مفتاح‖nonce‖عدّاد) كتيار مفاتيح
    XOR مع النصّ). يُولَّد nonce عشوائيّ 8 بايت لكل استدعاء ويُضمَّن في مقدّمة الناتج
    (8 بايت + النصّ المشفَّر)، والكلّ مُرمَّز ست عشريًّا. التنفيذ مطابق حرفيًّا بين
    المفسّر والمترجم (tools/compiler/runtime/sad_embedded_runtime.c، sad_security_encrypt) —
    ما يُشفَّر بأحد المحرِّكين يُفكّ بالآخر (تبادليّة كاملة). طول المفتاح غير محدود.
    ⚠️ للاستخدام الخفيف فقط — ليس بديلًا عن معايير معتمَدة كـAES-GCM لحماية بيانات حسّاسة
    حقًّا (لا مصادقة/AEAD، ولا nonce مُولَّد بمولّد عشوائيّ مُعتمَد تشفيريًّا).
  description_en: >-
    Encrypt text with a key via a SHA-256-CTR stream cipher (SHA-256(key‖nonce‖counter)
    used as an XOR keystream). An 8-byte random nonce is generated per call and
    prepended to the output; the whole buffer is hex-encoded. Bit-identical between
    the interpreter and the compiler runtime (sad_embedded_runtime.c,
    sad_security_encrypt) — ciphertext from either engine decrypts correctly with
    the other. Key length is unbounded. ⚠️ Lightweight use only — not a substitute
    for a vetted standard like AES-GCM for genuinely sensitive data (no
    authentication/AEAD, no cryptographically-secure nonce source).
  params:
  - نص — النصّ الأصليّ المراد تشفيره
  - مفتاح — مفتاح التشفير (أيّ طول)
  examples:
  - code: شفّر("سرّي", "مفتاحي")
    runnable: true
  lookup_table: name_only
- cpp_id: DECRYPT
  canonical: فك_تشفير
  namespace: Assertions
  arity:
    min: 2
    max: 2
  category: MODULE_FUNCTION
  require_import: true
  module: ASSERTIONS
  compiler_strategy: RUNTIME_CALL
  since: 0.1.0
  status: stable
  description_ar: >-
    فكّ تشفير ناتج «شفر» — يقرأ nonce الـ8 بايت من مقدّمة السلسلة الست عشرية، ثمّ يعيد
    توليد تيار مفاتيح SHA-256-CTR بنفس المفتاح لاستعادة النصّ الأصليّ. ⚠️ مسار الخطأ
    عند إدخال ست عشريّ غير صالح (طول فرديّ/أقصر من 16 حرفًا/رموز غير ست عشرية) **متباعد
    حاليًّا بين المحرِّكين**: المفسّر يرمي استثناءً قابلًا للالتقاط بـ`حاول`/`امسك`؛
    المترجم يطبع رسالة على stderr ويُعيد المدخل كما هو دون رمي استثناء لغويّ — فجوة
    توحيد معروفة غير مُغلَقة بعد (راجع RISK.md لقسم 09_المكتبة_القياسية/04_تشفير).
    المسار السعيد (فكّ تشفير ناتج صحيح من «شفر») مطابق حرفيًّا بين المحرِّكين.
  description_en: >-
    Decrypt output produced by «شفر»/ENCRYPT — reads the 8-byte nonce from the head
    of the hex string, then regenerates the SHA-256-CTR keystream with the same key
    to recover the original text. ⚠️ The error path for invalid hex input (odd
    length/shorter than 16 chars/non-hex digits) **currently diverges between
    engines**: the interpreter throws a catchable exception (`حاول`/`امسك`); the
    compiler prints to stderr and returns the input unchanged without raising a
    language-level exception — a known, unresolved unification gap (see RISK.md
    under 09_المكتبة_القياسية/04_تشفير). The happy path (decrypting valid ENCRYPT
    output) is bit-identical across both engines.
  params:
  - نص_مشفر — الناتج الست عشريّ من «شفر»
  - مفتاح — نفس المفتاح المُستخدَم في التشفير
  examples:
  - code: فك_تشفير(شفّر("سرّي", "مفتاحي"), "مفتاحي")
    runnable: true
  lookup_table: name_only
