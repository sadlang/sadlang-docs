- cpp_id: HASH
  canonical: هاش
  namespace: Assertions
  arity:
    min: 1
    max: 1
  category: MODULE_FUNCTION
  require_import: true
  module: ASSERTIONS
  compiler_strategy: RUNTIME_CALL
  since: 0.1.0
  status: stable
  description_ar: >-
    هاش SHA-256 (FIPS 180-4) لنصّ، يُعاد كسلسلة ست عشرية من 64 حرفًا.
    التنفيذ مطابق حرفيًّا بين المفسّر (interpreter/src/builtins/builtin_module_assertions.cpp)
    والمترجم (tools/compiler/runtime/sad_embedded_runtime.c، دالّة sad_security_hash) —
    نفس المدخل يُنتج نفس الهاش عبر كلا المحرّكين.
  description_en: >-
    SHA-256 (FIPS 180-4) hash of a value, returned as a 64-character hex string.
    Bit-identical between the interpreter (builtin_module_assertions.cpp) and the
    compiler runtime (sad_embedded_runtime.c, sad_security_hash) — same input yields
    the same hash across both engines.
  params:
  - نص — القيمة المراد حساب هاشها (تُحوَّل إلى نصّ عبر toString إن لم تكن نصًّا أصلًا)
  examples:
  - code: اطبع_سطر(هاش("مرحبا"))
    runnable: true
