      #      سياقيّ عمدًا (لا محجوز): «مؤكد»/«مؤكدة» كلمتان عربيّتان شائعتان تبقيان صالحتين
      #      كأسماء/أعضاء تعداد/ماكرو؛ المحلّل يميّزها لاحقيًّا عبر matchContextual في parsePostfix.
      # (EN) Null-assertion (NS-05) — postfix word, T? → T; two gendered synonyms.
      #      Deliberately contextual (not reserved): common Arabic words stay valid as
      #      identifiers/enum-members/macros; parser disambiguates via matchContextual in parsePostfix.
      - { id: "KW-CTX-040", subcategory: "null_safety", since: "1.0.0", word: "مؤكد", aliases: ["مؤكدة"], tokenType: OP_NULL_ASSERT, english: asserted }
