    Diffie-Hellman key exchange on Curve25519 (X25519, RFC 7748): multiplies a
    private key by the peer's public key (constant-time Montgomery ladder),
    producing a 32-byte shared secret (64-hex string) both parties agree on
    without transmitting it. Both inputs are hex (64 chars each); malformed input
    is an explicit error. **Mandatory security check (RFC 7748 §6.1): an
    all-zero shared secret is rejected with an error** — it results from
    low-order public keys that can be maliciously supplied to force a predictable
    secret. The raw secret is normally passed through اشتق_مفتاح (HKDF) rather
