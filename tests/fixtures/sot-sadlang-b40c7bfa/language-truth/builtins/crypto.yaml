    غرض الدالّة أصلًا فحص مدخلات غير موثوقة. المدخلات: الرسالة، والتوقيع الست
    عشريّ (128 حرفًا)، والمفتاح العامّ الست عشريّ (64 حرفًا). مُتحقَّق مقابل
