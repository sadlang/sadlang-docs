    إلزاميّ (RFC 7748 §6.1): يُرفض بخطأ أيّ سرّ مشترك كلّه أصفار** — ناتج عن
    مفاتيح عامّة منخفضة الرتبة (low-order) قد تُمرَّر خبيثًا لإجبار سرّ متوقَّع.
    السرّ الخامّ لا يُستعمَل مفتاحًا مباشرةً عادةً بل يُمرَّر عبر اشتق_مفتاح (HKDF).
    مُتحقَّق مقابل شعاعات RFC 7748 §5.2 و§6.1. مطابق حرفيًّا بين المفسّر والمترجم،
