  # ─── العدم / Null (S-TS-P1) — مُلحَق بالنهاية للحفاظ على ترتيب القيم السابقة (ABI) ───
  - { id: "type.null", kind: "Null", word: عدم, name_en: "null", category: special, surface: true, token_type: TYPE_NULL, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "العدم — غياب القيمة، متمايز عن فراغ (void). وتمثيلُه حارسٌ صحيحُ البتّات، فالحكمُ عليه يلزمُ أن يقومَ على وسمِ النوعِ لا على شكلِ التمثيل: مقارنةُ العدمِ بقيمةٍ من نوعٍ آخر تُحسَمُ بتطبيعِ الطرفِ الآخرِ إلى عرضِ الحارسِ ومقارنتِه به عدديًّا، فلا تُستدعى مقارنةُ نصوصٍ على الحارسِ أبدًا؛ و«عدم == عدم» صحيح. والوسمُ الساكنُ لا يكفي وحدَه ولا يمكنُ أن يكفي: خانةٌ نوعُها المُصرَّحُ «نصّ» تقبلُ نصًّا في موقعِ نداءٍ وعدمًا في آخر، فلا وسمَ ساكنًا واحدًا يصدُقُ على الاثنَين — والسؤالُ نفسُه سؤالُ زمنِ تشغيل. لذلكَ مقارنةُ النصوصِ آمنةٌ من العدمِ وقتَ التشغيل: يُفحَصُ الطرفانِ على الحارسِ قبلَ أيِّ قراءةِ ذاكرة، فالعدمُ يساوي العدمَ ولا يساوي نصًّا، ولا يُمرَّرُ الحارسُ إلى مقارنةِ نصوصٍ أبدًا", description_en: "Null — absence of value, distinct from void. Its representation is an integer sentinel, so judgements about it must rest on the type tag rather than on the shape of the representation: comparing null against a value of another type is decided by normalising the other side to the sentinel width and comparing numerically, so a string comparison is never invoked on the sentinel; and `null == null` is true. A static tag is not enough on its own and cannot be: a slot declared `string` accepts a string at one call site and null at another, so no single static tag is true of both — the question itself is a runtime one. String comparison is therefore null-safe at runtime: both sides are checked against the sentinel before any memory is read, so null equals null and never equals a string, and the sentinel is never handed to a string comparison" }

