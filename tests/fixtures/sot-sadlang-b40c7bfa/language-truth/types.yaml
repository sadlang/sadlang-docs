  - { id: type.map,   kind: Map,   word: خريطة,  name_en: map,   category: composite, surface: true,  token_type: TYPE_MAP,   can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "خريطة<K,V>", description_en: "Map/dictionary<K,V>" }
  - { id: type.tuple, kind: Tuple, word: صف,     name_en: tuple, category: composite, surface: false, since: "1.0.0", status: stable, description_ar: "صف (T1, T2, ...)", description_en: "Tuple (T1, T2, ...)" }
  - { id: type.slice, kind: Slice, word: شريحة,  name_en: slice, category: composite, surface: false, since: "1.0.0", status: stable, description_ar: "شريحة", description_en: "Slice" }

  # ─── كائنية / OOP ───
  - { id: type.class,  kind: Class,  word: صنف,   typeof_ar: كائن, name_en: class,  category: oop, surface: false, since: "1.0.0", status: stable, description_ar: "صنف", description_en: "Class" }
  - { id: type.struct, kind: Struct, word: بنية,  typeof_ar: كائن, name_en: struct, category: oop, surface: false, since: "1.0.0", status: stable, description_ar: "بنية", description_en: "Struct" }
  - { id: type.enum,   kind: Enum,   word: تعداد, name_en: enum,   category: oop, surface: false, since: "1.0.0", status: stable, description_ar: "تعداد", description_en: "Enum" }
  - { id: type.trait,  kind: Trait,  word: سمة,   name_en: trait,  category: oop, surface: false, since: "1.0.0", status: stable, description_ar: "سمة (واجهة)", description_en: "Trait/interface" }

  # ─── وظيفية / Function ───
  - { id: type.function, kind: Function, word: دالة,  name_en: function, category: function, surface: false, since: "1.0.0", status: stable, description_ar: "دالة (Params)->Return", description_en: "Function (Params)->Return" }
  - { id: type.closure,  kind: Closure,  word: إغلاق, name_en: closure,  category: function, surface: false, since: "1.0.0", status: stable, description_ar: "إغلاق (دالة + سياق)", description_en: "Closure (function + context)" }

  # ─── متقدمة / Advanced ───
  - { id: type.union,          kind: Union,         word: اتحاد,        name_en: union,          category: advanced, surface: false, since: "1.0.0", status: stable, description_ar: "اتحاد T1|T2", description_en: "Union T1|T2" }
  - { id: type.intersection,   kind: Intersection,  word: تقاطع,        name_en: intersection,   category: advanced, surface: false, since: "1.0.0", status: stable, description_ar: "تقاطع T1&T2", description_en: "Intersection T1&T2" }
  - { id: type.optional,       kind: Optional,      word: اختياري,      name_en: optional,       category: advanced, surface: false, since: "1.0.0", status: experimental, description_ar: "اختياري T? (قد يكون عدم)", description_en: "Optional T? (may be null)" }
  - { id: type.result,         kind: Result,        word: نتيجة,        name_en: result,         category: advanced, surface: false, since: "1.0.0", status: experimental, description_ar: "نتيجة<T, E> (نجاح أو خطأ)", description_en: "Result<T, E>" }
  - { id: type.generic,        kind: Generic,       word: نوع_عام,      name_en: generic,        category: advanced, surface: false, since: "1.0.0", status: stable, description_ar: "نوع عام (T)", description_en: "Generic type (T)" }
  - { id: type.type_parameter, kind: TypeParameter, word: معامل_نوع,    name_en: type_parameter, category: advanced, surface: false, since: "1.0.0", status: stable, description_ar: "معامل نوع فعلي", description_en: "Type parameter" }
  - { id: type.type_alias,     kind: TypeAlias,     word: اسم_مستعار,   name_en: type_alias,     category: advanced, surface: false, since: "1.0.0", status: stable, description_ar: "اسم مستعار لنوع", description_en: "Type alias" }

  # ─── مؤشرات ومراجع / Pointers & references ───
  - { id: type.pointer,     kind: Pointer,    word: مؤشر,        name_en: pointer,     category: pointer, surface: false, since: "1.0.0", status: stable, description_ar: "مؤشر خام", description_en: "Raw pointer" }
  - { id: type.reference,   kind: Reference,  word: مرجع,        name_en: reference,   category: pointer, surface: false, since: "1.0.0", status: stable, description_ar: "مرجع &T", description_en: "Reference &T" }
  - { id: type.mutable_ref, kind: MutableRef, word: مرجع_متغير,  name_en: mutable_ref, category: pointer, surface: false, since: "1.0.0", status: stable, description_ar: "مرجع متغير &mut T", description_en: "Mutable reference &mut T" }

  # ─── خاصة / Special ───
  - { id: type.any,     kind: Any,     word: أي,     name_en: any,     category: special, surface: true,  token_type: TYPE_ANY, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "أي نوع (ديناميكي)", description_en: "Any type (dynamic)" }
  - { id: type.never,   kind: Never,   word: أبدا,   name_en: never,   category: special, surface: false, since: "1.0.0", status: stable, description_ar: "أبداً — لا تُرجع", description_en: "Never returns" }
  - { id: type.unknown, kind: Unknown, word: مجهول,  name_en: unknown, category: special, surface: false, since: "1.0.0", status: stable, description_ar: "مجهول — يُستنتَج لاحقاً", description_en: "Unknown — inferred later" }
  - { id: type.error,   kind: Error,   word: خطأ,    name_en: error,   category: special, surface: false, since: "1.0.0", status: stable, description_ar: "نوع خطأ", description_en: "Error type" }

