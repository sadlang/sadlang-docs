# ============================================================================
# types.yaml — مصدر الحقيقة (SoT) لكل أنواع لغة ص
# Single Source of Truth for ALL Sad language type kinds
# ----------------------------------------------------------------------------
# (AR) يُولّد منه shared/types/generated/sad_type_kind_generated.h عبر
#      scripts/codegen/gen_types.py (مُفعَّل في cmake/codegen.cmake).
#      ⚠️ الترتيب حرج: قيم enum تُولَّد بنفس ترتيب هذه القائمة (توافق ثنائي).
# (EN) Generates SadTypeKind enum. ORDER IS CRITICAL — enum values are emitted
#      in this list's order (binary/serialization compatibility).
# ----------------------------------------------------------------------------
# (AR) كل نوع: kind (اسم enum) + category (التجميع) + surface (هل له كلمة/رمز).
#      الأنواع السطحية (surface: true) لها token_type وكلمة يكتبها المستخدم.
#      الأنواع الداخلية تمثيلات للمفسّر/المترجم بلا صيغة مصدرية مباشرة.
# ============================================================================

version: "5.0"
schema_version: "5.0"
description_ar: "كل أنواع لغة ص (49 نوعًا) — سطحية وداخلية، مصدر توليد SadTypeKind"
description_en: "All Sad type kinds (49) — surface + internal, SoT for SadTypeKind"

# (AR) ⚠️ تصحيحُ ملاحظةٍ بائتة (2026-08-11): كان هنا «النوع السطحي «عدم» ينتظر قيمة
#      SadTypeKind::Null … حاليًّا لا قيمة enum له» — وهذا لم يعد صحيحًا: القيمة
#      مُعرَّفةٌ في آخر القائمة (type.null، kind: Null) ومُولَّدةٌ فعلًا في
#      sad_type_kind_generated.h.
# (AR) ✅ وتحديثٌ ثانٍ (2026-08-14): الدَّينُ الباقي — أنّ المحلّلَ يُخفّض «عدم» إلى
#      SadTypeKind::Void فيساوي بينه وبين «فراغ» — **سُدَّ وأُغلقت ISSUE-113**.
#      المواضعُ البالغةُ كانت سبعةً لا ثلاثة (تُطلَب بالاسمِ لا بالرمز، إذ
#      emittedByLexer=false)، والحاكمُ السابعُ خارجَ المحلِّل: fromValueType بلا
#      حالةِ Null. ثمّ كشف الفصلُ عيبًا **مستقلًّا**: «فراغ» نفسُه كان يُقبَل خانةً
#      فينهار المترجّم — فصار مرفوضًا بـSEM040 في المحلّلِ المشترك (لا في خلفيّةٍ
#      بعينها) لأنّه بنصِّ هذا الملفّ «نوعُ الإرجاعِ الفارغ — لا قيمة».
#      مقيسٌ باختبارَين سالبَين مزدوجَين (067، 068).
# (EN) ISSUE-113 is closed: «عدم» no longer collapses into Void, and Void itself
#      is now rejected as a slot type (SEM040) in the shared parser.

categories_ar:
  primitive:       "بدائية"
  sized_primitive: "بدائية بحجم محدد (للمترجم)"
  composite:       "مركّبة"
  oop:             "كائنية"
  function:        "وظيفية"
  advanced:        "متقدمة (جبرية/عامة)"
  pointer:         "مؤشرات ومراجع"
  special:         "خاصة"
  async:           "غير متزامنة"
  graphics:        "رسومات"
  simd:            "متجهات SIMD"

# ============================================================================
# (AR) ألفاظُ أنواعٍ أُزيلت من اللغة — مصدرُ حقيقةٍ لمسارِ التشخيصِ الودّيّ.
#      المحلّلُ ما زال يتعرّف على اللفظِ **عمدًا** كي يُبلِّغ SYN014 برسالةٍ تُرشد
#      إلى البديل، بدل «معرّف غير معرَّف» الغامض. فوجودُه في الشيفرةِ مقصودٌ لا
#      انجراف — ولذلك يلزم أن يكون **مُعلَنًا هنا** كي يُميّزه حارسُ
#      scripts/codegen/check_type_words_sot.py عن بقيّةِ الانجراف.
# (EN) Type words removed from the language — SoT for the friendly-diagnostic
#      path. The parser still recognises them deliberately to emit SYN014
#      pointing at the replacement, so their presence must be declared here.
# ============================================================================
removed_type_words:
  - { word: مضاعف, replacement: عشري, error_code: SYN_REMOVED_SYNTAX, since: "1.0.0",
      description_ar: "أُزيلت لصالح «عشري» (f64) — لا نوعَ عشريًّا مزدوجَ الدقّةِ منفصلًا في ص",
      description_en: "Removed in favour of «عشري» (f64) — Sad has no separate double type" }

types:

  # ─── بدائية / Primitive ───
  - { id: type.void,    kind: Void,    word: فراغ,   name_en: void,    category: primitive, surface: true,  token_type: TYPE_VOID,    can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "نوع الإرجاع الفارغ — لا قيمة. متمايز عن «عدم» (type.null): «فراغ» ما لم يُرجَع أصلاً (مفتاح غائب، بحثٌ بلا مطابقة)، و«عدم» قيمةُ لاشيء الصريحة. فحصُ أحدهما وحده يمرّ ناقصًا", description_en: "Empty return type — no value. Distinct from «عدم» (type.null): «فراغ» is what was never returned (missing key, no regex match), «عدم» is the explicit null value. Checking only one of them passes incompletely" }
  - { id: type.integer, kind: Integer, word: رقم,    name_en: integer, category: primitive, surface: true,  token_type: TYPE_INTEGER, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "عدد صحيح (i64)", description_en: "64-bit integer" }
  - { id: type.float,   kind: Float,   word: عشري,   name_en: float,   category: primitive, surface: true,  token_type: TYPE_DOUBLE,  can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "عدد عشري (f64)", description_en: "64-bit float" }
  - { id: type.boolean, kind: Boolean, word: منطقي,  name_en: boolean, category: primitive, surface: true,  token_type: TYPE_BOOLEAN, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "قيمة منطقية (صحيح/خطأ)", description_en: "Boolean (true/false)" }
  - { id: type.string,  kind: String,  word: نص,     name_en: string,  category: primitive, surface: true,  token_type: TYPE_STRING,  can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "نص (UTF-8)", description_en: "UTF-8 string" }
  - { id: type.byte,    kind: Byte,    word: بايت,   name_en: byte,    category: primitive, surface: true,  token_type: TYPE_U8, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "بايت (u8، 0–255)", description_en: "Byte (u8, 0-255)" }

  # ─── بدائية بحجم محدد / Sized primitives (compiler) ───
  - { id: type.int8,    kind: Int8,    word: عدد8,   name_en: int8,    category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد صحيح 8-بت", description_en: "8-bit signed integer" }
  - { id: type.int16,   kind: Int16,   word: عدد16,  name_en: int16,   category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد صحيح 16-بت", description_en: "16-bit signed integer" }
  - { id: type.int32,   kind: Int32,   word: عدد32,  name_en: int32,   category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد صحيح 32-بت", description_en: "32-bit signed integer" }
  - { id: type.int64,   kind: Int64,   word: عدد64,  name_en: int64,   category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد صحيح 64-بت", description_en: "64-bit signed integer" }
  - { id: type.uint8,   kind: UInt8,   word: طبيعي8, name_en: uint8,   category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد طبيعي 8-بت", description_en: "8-bit unsigned integer" }
  - { id: type.uint16,  kind: UInt16,  word: طبيعي16, name_en: uint16, category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد طبيعي 16-بت", description_en: "16-bit unsigned integer" }
  - { id: type.uint32,  kind: UInt32,  word: طبيعي32, name_en: uint32, category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عدد طبيعي 32-بت", description_en: "32-bit unsigned integer" }
  - { id: type.uint64,  kind: UInt64,  word: طبيعي64, name_en: uint64, category: sized_primitive, surface: true,  token_type: TYPE_U64, can_be_identifier: true, since: "1.0.0", status: stable, description_ar: "عدد طبيعي 64-بت", description_en: "64-bit unsigned integer" }
  - { id: type.float32, kind: Float32, word: عشري32, name_en: float32, category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عشري 32-بت", description_en: "32-bit float" }
  - { id: type.float64, kind: Float64, word: عشري64, name_en: float64, category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "عشري 64-بت", description_en: "64-bit float" }
  - { id: type.char,    kind: Char,    word: حرف,    name_en: char,    category: sized_primitive, surface: false, since: "1.0.0", status: stable, description_ar: "حرف", description_en: "Character" }

  # ─── مركّبة / Composite ───
