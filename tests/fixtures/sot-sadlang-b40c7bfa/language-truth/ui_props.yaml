# ════════════════════════════════════════════════════════════════════════════
# (AR) مصدر الحقيقة المركزيّ لمفاتيح خصائص عناصر واجهة SadUI (IR property keys).
#      كلّ مفتاح خاصّيّة يكتبه مطوّر لغة ص (مثل «عنوان» في زر("عنوان")) معرَّفٌ هنا
#      حصرًا، فيصير موثَّقًا ومكتشَفًا في المرجع الرسميّ وأدوات LSP/sadinfo.
#      يُولَّد منه features/graphics/core/include/sad_ui/prop_keys.h عبر
#      scripts/codegen/gen_ui_props.py (لا يُحرَّر الهيدر يدويًّا).
#
#      قاعدة الطبقات: sad_graphics مكتبة طرفيّة لا تعتمد shared/builtins؛ الهيدر
#      المولَّد مُلتزَمٌ وذاتيّ الاكتفاء، فلا اعتماد ربط جديد — التوليد وقت البناء
#      لا وقت التشغيل (كما builtin_registry_generated.h المولَّد من language-truth).
#
# (EN) Central source of truth for SadUI IR property-key names. Every property key
#      a Sad developer writes (e.g. «عنوان» in زر("...")) is defined here, making it
#      documented and discoverable in the official reference and LSP/sadinfo tooling.
#      Generates features/graphics/core/include/sad_ui/prop_keys.h via
#      scripts/codegen/gen_ui_props.py (the header is never hand-edited).
# ════════════════════════════════════════════════════════════════════════════
version: 1
description_ar: مفاتيح خصائص عناصر واجهة SadUI
description_en: SadUI widget property keys

# (AR) الحقول لكلّ مفتاح:
#   id            — اسم الثابت في C++ (namespace sad::ui::props) — UPPER_SNAKE_CASE
#   canonical     — سلسلة المفتاح العربيّة القانونيّة (تُكتب في IRNode)
#   value_type    — نوع القيمة المتوقَّع (نصّ/عدد/منطقيّ)
#   description_ar/en — وصف بشريّ للتوثيق
#   latin_alias   — (اختياريّ) بديل احتياطيّ لاتينيّ يقرؤه المُرسِّم فقط، لا قانونيّ
keys:
  - id: TITLE
    canonical: عنوان
    value_type: نص
    description_ar: نصّ العنوان الظاهر للزرّ والشريط والحوار والتبويب
    description_en: Visible title text for button, app-bar, dialog, tab

  - id: CONTENT
    canonical: محتوى
    value_type: نص
    description_ar: محتوى النصّ لعنصر نص_عنصر ونظائره
    description_en: Text content for the نص_عنصر widget and similar

  - id: TEXT
    canonical: نص
    value_type: نص
    description_ar: نصّ عامّ (اسم بديل شائع للمحتوى، ونصّ التلميح)
    description_en: Generic text (common alias for content; tooltip text)

  # (AR) تنبيه التباس مقصود ومحفوظ تاريخيًّا: مفتاح ICON (canonical «أيقونة») يستعمله
  #   العنصران زر_عائم/زر_أيقونة، بينما العنصر «أيقونة»(Icon) نفسه يكتب مفتاح NAME
  #   (canonical «اسم») — أي `أيقونة("home")` يكتب «اسم» لا «أيقونة». سلوكٌ محفوظ.
  - id: ICON
    canonical: أيقونة
    value_type: نص
    description_ar: رمز/أيقونة الزرّ العائم وزرّ الأيقونة (يقبل رمزًا نصّيًّا)
    description_en: Icon/glyph for the floating-action and icon buttons

  - id: SOURCE
    canonical: مصدر
    value_type: نص
    description_ar: مصدر الصورة (مسار أو رابط)
    description_en: Image source (path or URL)

  - id: NAME
    canonical: اسم
    value_type: نص
    description_ar: اسم الأيقونة المتجهة (مفتاح عنصر «أيقونة» — لا يخلط بمفتاح ICON)
    description_en: Vector-icon name (key for the «أيقونة» widget — distinct from ICON)

  - id: HINT
    canonical: تلميح
    value_type: نص
    description_ar: نصّ التلميح الافتراضيّ لحقل الإدخال ومنطقة النصّ
    description_en: Placeholder hint for text field and text area

  - id: VALUE
    canonical: قيمة
    value_type: عدد أو منطقيّ
    description_ar: القيمة الحاليّة (عدديّة للمنزلق/شريط التقدّم، منطقيّة للمفتاح/خانة الاختيار)
    description_en: Current value (numeric for slider/progress, boolean for toggle/checkbox)

  - id: MESSAGE
    canonical: رسالة
    value_type: نص
    description_ar: نصّ الرسالة لشريط الإشعار
    description_en: Message text for the snack-bar

  - id: WIDTH
    canonical: عرض
    value_type: عدد
    description_ar: العرض الثابت (بالبكسل) لصندوق المقاس
    description_en: Fixed width (px) for the sized box

  - id: HEIGHT
    canonical: ارتفاع
    value_type: عدد
    description_ar: الارتفاع الثابت (بالبكسل) لصندوق المقاس
    description_en: Fixed height (px) for the sized box

  - id: ALIGN
    canonical: محاذاة
    value_type: نص
    description_ar: >-
      المحاذاة. للنصّ: «يمين»/«وسط» (أو right/center) — وإلّا يُحاذى النصّ العربيّ
      يمينًا تلقائيًّا. لحاويات العمود/الصفّ (المحور المتقاطع): «بداية» (افتراضيّ،
      اتّجاهيّ: العمود RTL يمينًا واللاتينيّ يسارًا، الصفّ أعلى) · «وسط» · «نهاية»
      (العمود يسار المحتوى في RTL، الصفّ أسفل) · «تمدّد» (يملأ المحور المتقاطع؛
      يتخطّاه الابن ذو المقاس الصريح في ذلك المحور).
    description_en: >-
      Alignment. For text: «يمين»/«وسط» (or right/center) — else Arabic text
      right-aligns automatically. For Column/Row containers (cross-axis):
      «بداية» (default, directional: Column RTL=right/LTR=left, Row=top) ·
      «وسط» (center) · «نهاية» (end) · «تمدّد» (stretch — fills the cross-axis;
      a child with an explicit cross-axis size opts out).

  # ── مفاتيح التخطيط (يقرؤها محرّك التخطيط LayoutEngine في الحاويات) ──────────
  # (AR) الحشو الداخليّ للحاوية — القانونيّ «حشوة» (بالتاء المربوطة، وهو ما يُنتجه
  #      types.cpp للمعدّل، انظر UINodeType::Padding⇒«حشوة») لا «حشو». يقرؤه محرّك
  #      التخطيط (layout.cpp) لإزاحة الأبناء داخليًّا.
  - id: PADDING
    canonical: حشوة
    value_type: عدد
    description_ar: الحشو الداخليّ للحاوية (بالبكسل) — إزاحة الأبناء داخل حدود العنصر
    description_en: Inner padding (px) for a container — inset of children within bounds

  # (AR) الحشو الاتّجاهيّ للحاوية — القانونيّ منطقيّ (أعلى/أسفل عموديّ ثابت، بداية/نهاية
  #      أفقيّ واعٍ بالـRTL: start=يمين، end=يسار كما يوثّق layout.h). هذه المفاتيح هي
  #      ما يُنتجه منتِج معدّلات DSL (types.cpp ⇒ ir_builder) في IRNode — فالقانونيّ =
  #      ما يكتبه DSL، نظير PADDING الأساس. تنبيه دَين: لا مستهلك يقرؤها بعدُ (layout.cpp
  #      يقرأ PADDING الأساس فقط) — التوحيد يزيل التباعُد النصّيّ لا يخترع مستهلكًا.
  - id: PADDING_TOP
    canonical: حشوة_أعلى
    value_type: عدد
    description_ar: الحشو العلويّ للحاوية (بالبكسل) — منطقيّ عموديّ ثابت
    description_en: Top padding (px) for a container — fixed vertical

  - id: PADDING_BOTTOM
    canonical: حشوة_أسفل
    value_type: عدد
    description_ar: الحشو السفليّ للحاوية (بالبكسل) — منطقيّ عموديّ ثابت
    description_en: Bottom padding (px) for a container — fixed vertical

  - id: PADDING_START
    canonical: حشوة_بداية
    value_type: عدد
    description_ar: حشو جهة البداية (بالبكسل) — منطقيّ واعٍ بالـRTL (start=يمين)
    description_en: Start-side padding (px) — RTL-aware logical (start=right)

  - id: PADDING_END
    canonical: حشوة_نهاية
    value_type: عدد
    description_ar: حشو جهة النهاية (بالبكسل) — منطقيّ واعٍ بالـRTL (end=يسار)
    description_en: End-side padding (px) — RTL-aware logical (end=left)

  - id: MARGIN
    canonical: هامش
    value_type: عدد
    description_ar: الهامش الخارجيّ (بالبكسل) — يُقحِم منطقة محتوى الحاوية
    description_en: Outer margin (px) — insets the container's content region

  - id: SPACING
    canonical: تباعد
    value_type: عدد
    description_ar: التباعد (بالبكسل) بين أبناء العمود/الصفّ المتتالين
    description_en: Spacing (px) between consecutive Column/Row children

  - id: WEIGHT
    canonical: وزن
    value_type: عدد
    description_ar: وزن المرونة (flex) — حصّة الابن من المساحة المتبقّية على المحور الرئيسيّ
    description_en: Flex weight — child's share of remaining main-axis space

  - id: COLUMNS
    canonical: أعمدة
    value_type: عدد
    description_ar: عدد أعمدة الشبكة (Grid)
    description_en: Number of grid columns

  - id: FONT_SIZE
    canonical: حجم_خط
    value_type: عدد
    description_ar: حجم خطّ النصّ (بالبكسل) — يؤثّر على قياس النصّ عرضًا وارتفاعًا
    description_en: Text font size (px) — affects text width and height measurement

  # ── أسماء بديلة (هجاء عربيّ بديل أو بديل لاتينيّ يقرؤه المُرسِّم/التخطيط فقط) ──
  - id: FONT_SIZE_ALT
    canonical: حجم_الخط
    value_type: عدد
    description_ar: هجاء بديل لـ«حجم_خط» (بأل التعريف) — مقبول في القياس
    description_en: Alternate spelling of «حجم_خط» — accepted in measurement

  - id: SIZE
    canonical: حجم
    value_type: عدد
    description_ar: اسم مختصر لحجم الخطّ (بديل لـ«حجم_خط»)
    description_en: Short alias for font size (alternate for «حجم_خط»)

  - id: FLEX_LATIN
    canonical: flex
    value_type: عدد
    latin_alias: true
    description_ar: بديل لاتينيّ لـ«وزن» (flex) — يقرؤه التخطيط فقط
    description_en: Latin alias for «وزن» (flex) — layout-read only

  - id: COLUMNS_LATIN
    canonical: columns
    value_type: عدد
    latin_alias: true
    description_ar: بديل لاتينيّ لـ«أعمدة» — يقرؤه التخطيط فقط
    description_en: Latin alias for «أعمدة» — layout-read only

  - id: WIDTH_LATIN
    canonical: width
    value_type: عدد
    latin_alias: true
    description_ar: بديل لاتينيّ لـ«عرض» — يقرؤه التخطيط فقط
    description_en: Latin alias for «عرض» — layout-read only

  - id: HEIGHT_LATIN
    canonical: height
    value_type: عدد
    latin_alias: true
    description_ar: بديل لاتينيّ لـ«ارتفاع» — يقرؤه التخطيط فقط
    description_en: Latin alias for «ارتفاع» — layout-read only

  # ── مفاتيح بصريّة (يقرؤها المُرسِّم PlatformRenderer عند الرسم) ──────────────
  - id: COLOR
    canonical: لون
    value_type: نص
    description_ar: "اللون العامّ للعنصر (سلسلة سداسيّة #RRGGBB أو اسم لون)"
    description_en: Generic element color (#RRGGBB hex string or color name)

  - id: TEXT_COLOR
    canonical: لون_النص
    value_type: نص
    description_ar: لون النصّ
    description_en: Text color

  - id: TEXT_COLOR_ALT
    canonical: لون_نص
    value_type: نص
    description_ar: هجاء بديل لـ«لون_النص» (بلا أل)
    description_en: Alternate spelling of «لون_النص»

  - id: BG
    canonical: خلفية
    value_type: نص
    description_ar: لون الخلفية (مفتاح مختصر)
    description_en: Background color (short key)

  - id: BG_COLOR
    canonical: لون_خلفية
    value_type: نص
    description_ar: لون خلفية العنصر (المعدّل الرسميّ)
    description_en: Element background color (canonical modifier)

  - id: ACTIVE_COLOR
    canonical: لون_نشط
    value_type: نص
    description_ar: لون الحالة النشطة (مفتاح/زرّ مفعَّل)
    description_en: Active-state color (toggle/enabled control)

  - id: BORDER_COLOR
    canonical: حد_لون
    value_type: نص
    description_ar: لون الحدّ الخارجيّ
    description_en: Outer border color

  - id: CORNER_RADIUS
    canonical: زوايا
    value_type: عدد
    description_ar: نصف قطر تدوير الزوايا (بالبكسل)
    description_en: Corner rounding radius (px)

  - id: RADIUS
    canonical: نصف_قطر
    value_type: عدد
    description_ar: نصف القطر (للدائرة/التدوير)
    description_en: Radius (for circle/rounding)

  - id: THICKNESS
    canonical: سماكة
    value_type: عدد
    description_ar: سماكة الخطّ/الحدّ (بالبكسل)
    description_en: Line/border thickness (px)

  - id: OPACITY
    canonical: شفافية
    value_type: عدد
    description_ar: الشفافية (0.0 شفّاف تمامًا … 1.0 معتِم)
    description_en: Opacity (0.0 transparent … 1.0 opaque)

  - id: SHADOW
    canonical: ظل
    value_type: نص
    description_ar: مواصفة الظلّ (وجوده/لونه)
    description_en: Shadow spec (presence/color)

  - id: GRADIENT
    canonical: تدرج
    value_type: نص
    description_ar: لون بداية التدرّج
    description_en: Gradient start color

  - id: GRADIENT_END
    canonical: تدرج_نهاية
    value_type: نص
    description_ar: لون نهاية التدرّج
    description_en: Gradient end color

  - id: ELEVATION
    canonical: رفع
    value_type: عدد
    description_ar: الارتفاع البصريّ (شدّة الظلّ)
    description_en: Visual elevation (shadow depth)

  - id: ENABLED
    canonical: مفعل
    value_type: منطقيّ
    description_ar: هل العنصر مفعَّل (تفاعليّ) أم مُعطَّل
    description_en: Whether the element is enabled (interactive) or disabled

  - id: TOTAL
    canonical: المجموع
    value_type: عدد
    description_ar: القيمة القصوى (لشريط التقدّم/المنزلق)
    description_en: Maximum/total value (progress bar / slider)

  - id: CURRENT
    canonical: الحالي
    value_type: عدد
    description_ar: القيمة الحاليّة (لشريط التقدّم/المنزلق)
    description_en: Current value (progress bar / slider)

  # دلالة مزدوجة بحسب نوع العنصر (مقصودة، وموثَّقة هنا لأنّها مصدر الحقيقة):
  #   • حاوية قابلة للتمرير (ScrollView/LazyColumn/LazyRow/List): إزاحة تمرير
  #     تُطبَّق على الأبناء وقت الرسم.
  #   • أيّ عنصر آخر: موضع حرّ يُزيح العنصر وكامل شجرته في محرّك التخطيط
  #     (يبقى اختبار النقر متّسقًا مع الرسم) — أساس سحب النوافذ بمنطق ص.
  - id: OFFSET_X
    canonical: إزاحة_س
    value_type: عدد
    description_ar: الإزاحة الأفقيّة بالبكسل — تمرير للحاويات القابلة للتمرير، وموضع حرّ لغيرها
    description_en: Horizontal offset (px) — scroll for scrollable containers, free position otherwise

  - id: OFFSET_Y
    canonical: إزاحة_ص
    value_type: عدد
    description_ar: الإزاحة الرأسيّة بالبكسل — تمرير للحاويات القابلة للتمرير، وموضع حرّ لغيرها
    description_en: Vertical offset (px) — scroll for scrollable containers, free position otherwise

  - id: ICON_ALT
    canonical: ايقونة
    value_type: نص
    description_ar: هجاء بديل لـ«أيقونة» (بألف بلا همزة) — اسم الأيقونة
    description_en: Alternate spelling of «أيقونة» (bare alef) — icon name

  - id: SYMBOL
    canonical: رمز
    value_type: نص
    description_ar: رمز نصّيّ (مثل محرف الأيقونة)
    description_en: Text symbol (e.g. icon glyph)

  - id: CHAR
    canonical: حرف
    value_type: نص
    description_ar: محرف واحد يُعرَض (نحو أوّل حرف من عنصر)
    description_en: Single displayed character (e.g. avatar initial)

  - id: PATH
    canonical: مسار
    value_type: نص
    description_ar: مسار المورد (صورة ونحوها)
    description_en: Resource path (image, etc.)

  - id: GROUP
    canonical: مجموعة
    value_type: نص
    description_ar: اسم مجموعة العنصر (أزرار الاختيار المترابطة ونحوها)
    description_en: Element group name (radio buttons and similar)

  # ── مفاتيح إضافيّة تقرؤها مولِّدات المنصّات (backends) والمُرسِّم المكتبيّ ──────
  - id: MIN
    canonical: أدنى
    value_type: عدد
    description_ar: القيمة الدنيا (منزلق/مدى)
    description_en: Minimum value (slider/range)

  - id: MAX
    canonical: أقصى
    value_type: عدد
    description_ar: القيمة القصوى (منزلق/مدى)
    description_en: Maximum value (slider/range)

  - id: TOTAL_SUM
    canonical: إجمالي
    value_type: عدد
    description_ar: المجموع الكلّيّ (بديل دلاليّ لـ«المجموع»)
    description_en: Grand total (semantic alias of «المجموع»)

  - id: LINE_NUMBERS
    canonical: أرقام_أسطر
    value_type: منطقيّ
    description_ar: إظهار أرقام الأسطر (محرِّر الشيفرة)
    description_en: Show line numbers (code editor)

  - id: CELL_SIZE
    canonical: حجم_خلية
    value_type: عدد
    description_ar: حجم الخليّة (بالبكسل) في الشبكة/الجدول
    description_en: Cell size (px) in grid/table

  - id: BOUNDS
    canonical: حدود
    value_type: نص
    description_ar: حدود المنطقة (نطاق/إطار)
    description_en: Region bounds (extent/frame)

  - id: CIRCLE
    canonical: دائرة
    value_type: منطقيّ
    description_ar: هل الشكل دائريّ (نحو صورة رمزيّة)
    description_en: Whether the shape is circular (e.g. avatar)

  - id: DARK
    canonical: داكن
    value_type: منطقيّ
    description_ar: هل السمة داكنة
    description_en: Whether the theme is dark

  - id: THICKNESS_ALT
    canonical: سمك
    value_type: عدد
    description_ar: هجاء بديل لـ«سماكة» (سمك الخطّ/الحدّ)
    description_en: Alternate spelling of «سماكة» (line/border thickness)

  - id: PAGE
    canonical: صفحة
    value_type: عدد
    description_ar: رقم الصفحة (ترقيم الصفحات)
    description_en: Page number (pagination)

  - id: CODE
    canonical: كود
    value_type: نص
    description_ar: نصّ الشيفرة المصدريّة (كتلة/محرِّر شيفرة)
    description_en: Source-code text (code block/editor)

  - id: LANGUAGE
    canonical: لغة
    value_type: نص
    description_ar: لغة الشيفرة (للإبراز النحويّ)
    description_en: Code language (for syntax highlighting)

  - id: ICON_COLOR
    canonical: لون_الايقونة
    value_type: نص
    description_ar: لون الأيقونة
    description_en: Icon color

  - id: HANDLE_COLOR
    canonical: لون_المقبض
    value_type: نص
    description_ar: لون مقبض المنزلق/المفتاح
    description_en: Slider/toggle handle color

  - id: SELECTED
    canonical: محدد
    value_type: منطقيّ
    description_ar: هل العنصر محدَّد (خانة اختيار/تبويب نشط)
    description_en: Whether the element is selected (checkbox/active tab)

  - id: ALT_TEXT
    canonical: نص_بديل
